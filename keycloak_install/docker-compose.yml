
services:
  keycloak:
    build:
      dockerfile: Dockerfile
      args:
        KEYCLOAK_TARGET_REALM: ${TF_VAR_realm_id}
        KEYCLOAK_TERRAFORM_CLIENT_ID: ${TF_VAR_keycloak_terraform_client_id}
        KEYCLOAK_TERRAFORM_CLIENT_SECRET: ${TF_VAR_keycloak_terraform_client_secret}
        KC_BOOTSTRAP_ADMIN_PASSWORD: admin
        KC_BOOTSTRAP_ADMIN_USERNAME: admin
    container_name: keycloak
    environment:
      KC_HTTP_ENABLED: false
      KC_HOSTNAME: keycloak.local
      KC_HOSTNAME_STRICT: true
      KC_HOSTNAME_STRICT_HTTPS: true
      # HTTPS
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/keycloak.local.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/keycloak.local-key.pem

      KC_PROXY: none

    volumes:
      - ./https/certs:/opt/keycloak/certs:ro
    ports:
      - 8443:8443
    command:
      - start-dev
      - --log-level=INFO
      - --import-realm
  sector-json:
    build:
      context: ./ppid_sector_server
      dockerfile: Dockerfile.dev
      args:
        SECTOR_A_HOST: "sector-a.local"
        SECTOR_B_HOST: "sector-b.local"
    container_name: sector-json
    restart: unless-stopped
    ports:
      - "9443:8443"
    environment:
      PORT: "8443"
      SECTOR_A_HOST: "sector-a.local"
      SECTOR_B_HOST: "sector-b.local"
      TLS_CERT: "/app/certs/cert.pem"
      TLS_KEY: "/app/certs/key.pem"
    volumes:
      - ./ppid_sector_server/certs:/app/certs:ro

