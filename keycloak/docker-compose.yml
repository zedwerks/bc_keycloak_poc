
services:
  keycloak:
    build:
      dockerfile: Dockerfile
      args:
        KEYCLOAK_TARGET_REALM: ${TF_VAR_realm_id}
        KEYCLOAK_TERRAFORM_CLIENT_ID: ${TF_VAR_keycloak_terraform_client_id}
        KEYCLOAK_TERRAFORM_CLIENT_SECRET: ${TF_VAR_keycloak_terraform_client_secret}
        KC_BOOTSTRAP_ADMIN_PASSWORD: admin
        KC_BOOTSTRAP_ADMIN_USERNAME: admin
    container_name: keycloak
    environment:
      KC_HTTP_ENABLED: false
      KC_HOSTNAME: keycloak.local
      KC_HOSTNAME_STRICT: true
      KC_HOSTNAME_STRICT_HTTPS: true
      # HTTPS
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/keycloak.local.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/keycloak.local-key.pem

      KC_PROXY: none

    volumes:
      - ./https/certs:/opt/keycloak/certs:ro
    ports:
      - 8443:8443
    command:
      - start-dev
      - --log-level=INFO
      - --import-realm
    networks:
      - keycloak-network

  delegation-svc:
  # access this from inside Keycloak using http://delegation-svc:3000
    build:
      context: ./delegation_service
      dockerfile: Dockerfile
    container_name: delegation-svc
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      EXPECTED_ISSUER: "https://keycloak.local:8443/realms/poc"
      REQUIRED_AUDIENCE: "delegation-svc"
    networks:
      - keycloak-network

  sector-json:
    build:
      context: ./ppid_sector_server
      dockerfile: Dockerfile.dev
      args:
        HOST_SECTOR_SVC: "sector-svc.local"
    container_name: sector-json
    restart: unless-stopped
    ports:
      - "9443:8443"
    environment:
      PORT: "8443"
      HOST_SECTOR_SVC: "sector-svc.local"
      TLS_CERT: "/app/certs/cert.pem"
      TLS_KEY: "/app/certs/key.pem"
    volumes:
      - ./ppid_sector_server/certs:/app/certs:ro
    networks:
      - keycloak-network

networks:
  keycloak-network:
    driver: bridge
